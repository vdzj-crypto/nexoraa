<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quotations Hub - منصة عروض الأسعار والشراء</title>
    
    <!-- Bootstrap 5 RTL & FontAwesome & TailwindCSS -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.rtl.min.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- HTML2PDF & Supabase JS Libraries -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <style>
        @import url('https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800&display=swap');
        
        body {
            font-family: 'Tajawal', sans-serif;
            background-color: #f8fafc;
            color: #1e293b;
        }

        .sidebar {
            background-color: #1b2537;
            color: #ffffff;
            min-height: 100vh;
            transition: all 0.3s ease;
        }

        .sidebar .nav-link {
            color: #94a3b8;
            border-radius: 10px;
            padding: 12px 18px;
            margin-bottom: 6px;
            font-weight: 500;
            display: flex;
            align-items: center;
            gap: 12px;
            transition: all 0.2s ease-in-out;
        }

        .sidebar .nav-link:hover {
            color: #ffffff;
            background-color: rgba(255, 255, 255, 0.08);
        }

        .sidebar .nav-link.active {
            color: #ffffff;
            background-color: #2563eb;
            box-shadow: 0 4px 12px rgba(37, 99, 235, 0.3);
        }

        .card-custom {
            background: #ffffff;
            border-radius: 14px;
            border: 1px solid #e2e8f0;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.05), 0 2px 4px -1px rgba(0, 0, 0, 0.03);
        }

        .btn-custom-primary {
            background-color: #10b981;
            color: white;
            font-weight: 700;
            transition: all 0.2s;
        }

        .btn-custom-primary:hover {
            background-color: #059669;
        }

        table th {
            background-color: #f1f5f9;
            color: #475569;
            font-weight: 700;
        }

        .badge-status {
            padding: 4px 10px;
            border-radius: 20px;
            font-size: 0.75rem;
            font-weight: 700;
        }

        .badge-hospitality { background-color: #fef3c7; color: #d97706; }
        .badge-cleaning { background-color: #e0e7ff; color: #4338ca; }
        .badge-stationery { background-color: #dcfce7; color: #15803d; }
    </style>
</head>
<body class="bg-slate-50">

<div class="flex flex-col md:flex-row min-h-screen">
    
    <!-- الشريط الجانبي (Sidebar) -->
    <aside class="w-full md:w-72 sidebar p-5 flex flex-col justify-between shadow-xl">
        <div>
            <!-- اسم التطبيق والشعار -->
            <div class="flex items-center gap-3 mb-10 px-2 pt-2">
                <div class="bg-blue-600 p-2.5 rounded-xl text-white">
                    <i class="fa-solid fa-file-invoice-dollar text-2xl"></i>
                </div>
                <div>
                    <h1 class="text-xl font-black tracking-wide text-white">Quotations Hub</h1>
                    <p class="text-xs text-slate-400">إدارة وعروض الأسعار</p>
                </div>
            </div>
            
            <!-- القائمة الرئيسية -->
            <nav class="nav flex-column">
                <a href="#" onclick="showPage('dashboard')" class="nav-link active" id="link-dashboard">
                    <i class="fa-solid fa-chart-pie text-lg"></i> لوحة التحكم
                </a>
                <a href="#" onclick="showPage('hospitality')" class="nav-link" id="link-hospitality">
                    <i class="fa-solid fa-mug-hot text-lg"></i> الضيافة والبوفيه
                </a>
                <a href="#" onclick="showPage('cleaning')" class="nav-link" id="link-cleaning">
                    <i class="fa-solid fa-pump-soap text-lg"></i> أدوات النظافة
                </a>
                <a href="#" onclick="showPage('stationery')" class="nav-link" id="link-stationery">
                    <i class="fa-solid fa-print text-lg"></i> القرطاسية والإلكترونيات
                </a>
                <a href="#" onclick="showPage('summary')" class="nav-link" id="link-summary">
                    <i class="fa-solid fa-list-check text-lg"></i> الملخص الشامل والعهدة
                </a>
                <a href="#" onclick="showPage('archive')" class="nav-link" id="link-archive">
                    <i class="fa-solid fa-box-archive text-lg"></i> الأرشيف الشهري
                </a>

                <div class="my-4 border-t border-slate-700/60"></div>
                
                <div class="px-3 mb-2 text-xs font-bold text-slate-400 tracking-wider">الإدارة والإعدادات</div>
                
                <a href="#" onclick="showPage('manage-items')" class="nav-link" id="link-manage-items">
                    <i class="fa-solid fa-boxes-stacked text-lg"></i> إدارة الأصناف
                </a>
                <a href="#" onclick="showPage('manage-suppliers')" class="nav-link" id="link-manage-suppliers">
                    <i class="fa-solid fa-truck-field text-lg"></i> الموردين
                </a>
                <a href="#" onclick="showPage('manage-employees')" class="nav-link" id="link-manage-employees">
                    <i class="fa-solid fa-users text-lg"></i> الموظفين والجهات
                </a>
            </nav>
        </div>

        <div class="pt-6 border-t border-slate-700/60 text-center">
            <span class="inline-flex items-center gap-2 px-3 py-1 rounded-full bg-slate-800 text-slate-300 text-xs font-medium">
                <span class="w-2 h-2 rounded-full bg-emerald-500 animate-pulse"></span> متصل بـ Supabase
            </span>
            <div class="text-xs text-slate-500 mt-2">الإصدار v2.4</div>
        </div>
    </aside>

    <!-- المحتوى الرئيسي (Main Content) -->
    <main class="flex-1 p-6 md:p-8 overflow-y-auto">
        <!-- الشريط العلوي -->
        <header class="flex justify-between items-center mb-8 bg-white p-5 rounded-2xl border border-slate-200/80 shadow-sm">
            <div>
                <h2 id="page-title" class="text-2xl font-black text-slate-800">لوحة التحكم</h2>
                <p id="page-subtitle" class="text-xs text-slate-500 mt-1">نظرة عامة على العروض والإحصائيات</p>
            </div>
            <div id="live-time" class="text-sm font-bold text-slate-600 bg-slate-100 px-4 py-2 rounded-xl border border-slate-200 shadow-inner flex items-center gap-2">
                <i class="fa-regular fa-clock text-blue-500"></i>
                <span id="clock-text">--:--:--</span>
            </div>
        </header>

        <!-- حاوية الصفحات الديناميكية -->
        <div id="app-content"></div>
    </main>
</div>

<script>
// =============================================================
// 1. إعدادات ومفاتيح Supabase المدمجة
// =============================================================
const SUPABASE_URL = 'https://vhzkwpfecausuaklagcq.supabase.co';
const SUPABASE_ANON_KEY = 'sb_publishable_01gWxJcTz2yL4VU8vZQgyQ_Xn9rCdc2';
const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

// =============================================================
// 2. الذاكرة المحلية والبيانات الافتراضية
// =============================================================
let db = {
    items: JSON.parse(localStorage.getItem('db_items')) || [
        { id: 1, category: 'hospitality', name: 'شاي كبوس' },
        { id: 2, category: 'hospitality', name: 'قهوة عربية' },
        { id: 3, category: 'cleaning', name: 'منظف أرضيات' },
        { id: 4, category: 'stationery', name: 'ورق طباعة A4' }
    ],
    suppliers: JSON.parse(localStorage.getItem('db_suppliers')) || [
        { id: 1, name: 'الصالة الاقتصادية' },
        { id: 2, name: 'مكتبة جرير' },
        { id: 3, name: 'أسواق التميمي' }
    ],
    employees: JSON.parse(localStorage.getItem('db_employees')) || [
        { id: 1, name: 'إبراهيم العلي (الإدارة)' },
        { id: 2, name: 'قسم المشتريات' },
        { id: 3, name: 'قسم IT' }
    ],
    quotations: JSON.parse(localStorage.getItem('db_quotations')) || []
};

// مزامنة البيانات من وإلى Supabase
async function syncFromSupabase() {
    try {
        const { data: items, error: e1 } = await supabaseClient.from('items').select('*');
        if (items && !e1) db.items = items;

        const { data: suppliers, error: e2 } = await supabaseClient.from('suppliers').select('*');
        if (suppliers && !e2) db.suppliers = suppliers;

        const { data: employees, error: e3 } = await supabaseClient.from('employees').select('*');
        if (employees && !e3) db.employees = employees;

        const { data: quotations, error: e4 } = await supabaseClient.from('quotations').select('*');
        if (quotations && !e4) db.quotations = quotations;

        saveLocal();
    } catch (e) {
        console.warn("تعذر الاتصال بقاعدة البيانات السحابية، يتم الاعتماد على الذاكرة المحلية:", e);
    }
}

function saveLocal() {
    localStorage.setItem('db_items', JSON.stringify(db.items));
    localStorage.setItem('db_suppliers', JSON.stringify(db.suppliers));
    localStorage.setItem('db_employees', JSON.stringify(db.employees));
    localStorage.setItem('db_quotations', JSON.stringify(db.quotations));
}

// =============================================================
// 3. إدارة التبويبات والتنقل
// =============================================================
function showPage(pageId) {
    document.querySelectorAll('.nav-link').forEach(l => l.classList.remove('active'));
    const activeLink = document.getElementById(`link-${pageId}`);
    if (activeLink) activeLink.classList.add('active');

    const container = document.getElementById('app-content');
    
    if (pageId === 'dashboard') renderDashboard(container);
    else if (['hospitality', 'cleaning', 'stationery'].includes(pageId)) renderQuotationPage(container, pageId);
    else if (pageId === 'summary') renderSummaryPage(container);
    else if (pageId === 'archive') renderArchivePage(container);
    else if (pageId === 'manage-items') renderManageItemsPage(container);
    else if (pageId === 'manage-suppliers') renderManageSuppliersPage(container);
    else if (pageId === 'manage-employees') renderManageEmployeesPage(container);
}

// =============================================================
// 4. بناء الصفحات والتفاعل الكامل
// =============================================================

// --- 4.1 لوحة التحكم ---
function renderDashboard(c) {
    document.getElementById('page-title').innerText = 'لوحة التحكم الرئيسية';
    document.getElementById('page-subtitle').innerText = 'ملخص سريع للأداء والمبالغ المعالجة بالنظام';

    const totalQuotes = db.quotations.length;
    const totalAmount = db.quotations.reduce((sum, q) => sum + Number(q.total || 0), 0).toFixed(2);
    const hospCount = db.quotations.filter(q => q.category === 'hospitality').length;
    const cleanCount = db.quotations.filter(q => q.category === 'cleaning').length;
    const statCount = db.quotations.filter(q => q.category === 'stationery').length;

    c.innerHTML = `
        <div class="grid grid-cols-1 md:grid-cols-4 gap-6 mb-8">
            <div class="card-custom p-6 border-r-4 border-blue-600">
                <div class="flex items-center justify-between">
                    <div>
                        <p class="text-xs font-bold text-slate-400 uppercase">إجمالي العروض</p>
                        <h3 class="text-3xl font-black mt-2 text-slate-800">${totalQuotes}</h3>
                    </div>
                    <div class="p-3 bg-blue-50 text-blue-600 rounded-xl"><i class="fa-solid fa-receipt text-2xl"></i></div>
                </div>
            </div>

            <div class="card-custom p-6 border-r-4 border-emerald-600">
                <div class="flex items-center justify-between">
                    <div>
                        <p class="text-xs font-bold text-slate-400 uppercase">المبلغ الإجمالي</p>
                        <h3 class="text-2xl font-black mt-2 text-emerald-600">${totalAmount} <span class="text-xs font-normal">ر.س</span></h3>
                    </div>
                    <div class="p-3 bg-emerald-50 text-emerald-600 rounded-xl"><i class="fa-solid fa-coins text-2xl"></i></div>
                </div>
            </div>

            <div class="card-custom p-6 border-r-4 border-purple-600">
                <div class="flex items-center justify-between">
                    <div>
                        <p class="text-xs font-bold text-slate-400 uppercase">عدد الموردين</p>
                        <h3 class="text-3xl font-black mt-2 text-slate-800">${db.suppliers.length}</h3>
                    </div>
                    <div class="p-3 bg-purple-50 text-purple-600 rounded-xl"><i class="fa-solid fa-truck-field text-2xl"></i></div>
                </div>
            </div>

            <div class="card-custom p-6 border-r-4 border-orange-500">
                <div class="flex items-center justify-between">
                    <div>
                        <p class="text-xs font-bold text-slate-400 uppercase">الأصناف المتاحة</p>
                        <h3 class="text-3xl font-black mt-2 text-slate-800">${db.items.length}</h3>
                    </div>
                    <div class="p-3 bg-orange-50 text-orange-600 rounded-xl"><i class="fa-solid fa-boxes-stacked text-2xl"></i></div>
                </div>
            </div>
        </div>

        <!-- توزيع العروض حسب الأقسام -->
        <div class="grid grid-cols-1 md:grid-cols-3 gap-6">
            <div class="card-custom p-6">
                <h4 class="font-bold text-slate-700 mb-4 flex items-center gap-2"><i class="fa-solid fa-mug-hot text-amber-500"></i> الضيافة والبوفيه</h4>
                <div class="text-2xl font-bold text-slate-800 mb-2">${hospCount} <span class="text-xs text-slate-400 font-normal">عرض سعر</span></div>
                <div class="w-full bg-slate-100 rounded-full h-2">
                    <div class="bg-amber-500 h-2 rounded-full" style="width: ${totalQuotes ? (hospCount/totalQuotes)*100 : 0}%"></div>
                </div>
            </div>

            <div class="card-custom p-6">
                <h4 class="font-bold text-slate-700 mb-4 flex items-center gap-2"><i class="fa-solid fa-pump-soap text-indigo-500"></i> أدوات النظافة</h4>
                <div class="text-2xl font-bold text-slate-800 mb-2">${cleanCount} <span class="text-xs text-slate-400 font-normal">عرض سعر</span></div>
                <div class="w-full bg-slate-100 rounded-full h-2">
                    <div class="bg-indigo-500 h-2 rounded-full" style="width: ${totalQuotes ? (cleanCount/totalQuotes)*100 : 0}%"></div>
                </div>
            </div>

            <div class="card-custom p-6">
                <h4 class="font-bold text-slate-700 mb-4 flex items-center gap-2"><i class="fa-solid fa-print text-green-500"></i> القرطاسية والإلكترونيات</h4>
                <div class="text-2xl font-bold text-slate-800 mb-2">${statCount} <span class="text-xs text-slate-400 font-normal">عرض سعر</span></div>
                <div class="w-full bg-slate-100 rounded-full h-2">
                    <div class="bg-green-500 h-2 rounded-full" style="width: ${totalQuotes ? (statCount/totalQuotes)*100 : 0}%"></div>
                </div>
            </div>
        </div>
    `;
}

// --- 4.2 صفحة إضافة وتصفح عروض الأسعار ---
function renderQuotationPage(c, cat) {
    const titles = { hospitality: 'عروض الضيافة والبوفيه', cleaning: 'عروض أدوات النظافة', stationery: 'عروض القرطاسية والإلكترونيات' };
    const icons = { hospitality: 'fa-mug-hot', cleaning: 'fa-pump-soap', stationery: 'fa-print' };
    
    document.getElementById('page-title').innerText = titles[cat];
    document.getElementById('page-subtitle').innerText = 'إدخال ومتابعة أسعار المنتجات والموردين المقترحين';

    const categoryItems = db.items.filter(i => i.category === cat);

    c.innerHTML = `
        <div class="card-custom p-6 mb-8">
            <h3 class="text-lg font-bold mb-6 text-slate-800 border-b pb-3 flex items-center gap-2">
                <i class="fa-solid ${icons[cat]} text-blue-600"></i> إضافة عرض سعر جديد
            </h3>
            
            <form onsubmit="addQuotation(event, '${cat}')" class="grid grid-cols-1 md:grid-cols-4 gap-4">
                <div>
                    <label class="block text-xs font-bold text-slate-600 mb-2">الصنف</label>
                    <select id="q-item" required class="w-full p-2.5 border border-slate-300 rounded-xl focus:ring-2 focus:ring-blue-500 focus:outline-none">
                        <option value="">اختر الصنف...</option>
                        ${categoryItems.map(i => `<option value="${i.name}">${i.name}</option>`).join('')}
                    </select>
                </div>

                <div>
                    <label class="block text-xs font-bold text-slate-600 mb-2">الكمية</label>
                    <input type="number" id="q-qty" value="1" min="1" required oninput="calcTotal()" class="w-full p-2.5 border border-slate-300 rounded-xl focus:ring-2 focus:ring-blue-500 focus:outline-none">
                </div>

                <div>
                    <label class="block text-xs font-bold text-slate-600 mb-2">سعر الوحدة (ر.س)</label>
                    <input type="number" step="0.01" id="q-price" required oninput="calcTotal()" placeholder="0.00" class="w-full p-2.5 border border-slate-300 rounded-xl focus:ring-2 focus:ring-blue-500 focus:outline-none">
                </div>

                <div>
                    <label class="block text-xs font-bold text-slate-600 mb-2">نوع معاملة الضريبة</label>
                    <select id="q-tax" onchange="calcTotal()" class="w-full p-2.5 border border-slate-300 rounded-xl focus:ring-2 focus:ring-blue-500 focus:outline-none">
                        <option value="15">السعر شامل الضريبة (15%)</option>
                        <option value="0">غير شامل الضريبة</option>
                    </select>
                </div>

                <div>
                    <label class="block text-xs font-bold text-slate-600 mb-2">المورد</label>
                    <select id="q-supplier" required class="w-full p-2.5 border border-slate-300 rounded-xl focus:ring-2 focus:ring-blue-500 focus:outline-none">
                        <option value="">اختر المورد...</option>
                        ${db.suppliers.map(s => `<option value="${s.name}">${s.name}</option>`).join('')}
                    </select>
                </div>

                <div>
                    <label class="block text-xs font-bold text-slate-600 mb-2">المستفيد / الجهة الطالبة</label>
                    <select id="q-emp" required class="w-full p-2.5 border border-slate-300 rounded-xl focus:ring-2 focus:ring-blue-500 focus:outline-none">
                        <option value="">اختر المستفيد...</option>
                        ${db.employees.map(e => `<option value="${e.name}">${e.name}</option>`).join('')}
                    </select>
                </div>

                <div>
                    <label class="block text-xs font-bold text-slate-600 mb-2">الإجمالي النهائي</label>
                    <input type="text" id="q-total" readonly placeholder="0.00" class="w-full p-2.5 border border-slate-200 rounded-xl bg-slate-100 font-black text-emerald-600 text-lg">
                </div>

                <div class="flex items-end">
                    <button type="submit" class="w-full btn-custom-primary py-2.5 px-4 rounded-xl flex items-center justify-center gap-2 shadow-lg shadow-emerald-600/20">
                        <i class="fa-solid fa-plus"></i> إضافة إلى العروض
                    </button>
                </div>
            </form>
        </div>

        <!-- جدول عروض الأسعار المسجلة -->
        <div class="card-custom p-6">
            <h3 class="text-base font-bold mb-4 text-slate-800">قائمة العروض المضافة في هذا القسم</h3>
            <div class="overflow-x-auto">
                <table class="w-full text-right border-collapse">
                    <thead>
                        <tr class="bg-slate-100/70 text-slate-600 text-xs">
                            <th class="p-3 border-b">الصنف</th>
                            <th class="p-3 border-b">الكمية</th>
                            <th class="p-3 border-b">السعر الفردي</th>
                            <th class="p-3 border-b">معاملة الضريبة</th>
                            <th class="p-3 border-b">المورد</th>
                            <th class="p-3 border-b">المستفيد</th>
                            <th class="p-3 border-b">الإجمالي</th>
                            <th class="p-3 border-b text-center">إجراء</th>
                        </tr>
                    </thead>
                    <tbody>
                        ${db.quotations.filter(q => q.category === cat).map(q => `
                            <tr class="border-b text-sm hover:bg-slate-50">
                                <td class="p-3 font-semibold text-slate-800">${q.item_name}</td>
                                <td class="p-3">${q.quantity}</td>
                                <td class="p-3">${q.price} ر.س</td>
                                <td class="p-3 text-xs text-slate-500">${q.tax_type == '15' ? 'شامل (15%)' : 'بدون ضريبة'}</td>
                                <td class="p-3"><span class="bg-slate-100 text-slate-700 px-2 py-1 rounded-md text-xs font-bold">${q.supplier}</span></td>
                                <td class="p-3">${q.beneficiary}</td>
                                <td class="p-3 font-black text-emerald-600">${q.total} ر.س</td>
                                <td class="p-3 text-center">
                                    <button onclick="deleteQuote(${q.id}, '${cat}')" class="text-red-500 hover:text-red-700 p-2 rounded-lg hover:bg-red-50 transition">
                                        <i class="fa-solid fa-trash-can"></i>
                                    </button>
                                </td>
                            </tr>
                        `).join('')}
                        ${db.quotations.filter(q => q.category === cat).length === 0 ? `
                            <tr><td colspan="8" class="text-center py-8 text-slate-400">لا توجد عروض أسعار مسجلة في هذا القسم حتى الآن</td></tr>
                        ` : ''}
                    </tbody>
                </table>
            </div>
        </div>
    `;
}

function calcTotal() {
    const qty = parseFloat(document.getElementById('q-qty').value) || 0;
    const price = parseFloat(document.getElementById('q-price').value) || 0;
    const total = (qty * price).toFixed(2);
    document.getElementById('q-total').value = total;
}

async function addQuotation(e, cat) {
    e.preventDefault();
    const newQ = {
        id: Date.now(),
        category: cat,
        item_name: document.getElementById('q-item').value,
        quantity: parseFloat(document.getElementById('q-qty').value),
        price: parseFloat(document.getElementById('q-price').value),
        tax_type: document.getElementById('q-tax').value,
        supplier: document.getElementById('q-supplier').value,
        beneficiary: document.getElementById('q-emp').value,
        total: parseFloat(document.getElementById('q-total').value),
        date: new Date().toISOString().split('T')[0]
    };

    db.quotations.push(newQ);
    saveLocal();

    try { await supabaseClient.from('quotations').insert([newQ]); } catch (err) {}

    renderQuotationPage(document.getElementById('app-content'), cat);
}

async function deleteQuote(id, cat) {
    db.quotations = db.quotations.filter(q => q.id !== id);
    saveLocal();
    try { await supabaseClient.from('quotations').delete().eq('id', id); } catch (err) {}
    renderQuotationPage(document.getElementById('app-content'), cat);

function renderSummaryPage(c) {
    document.getElementById('page-title').innerText = 'الملخص الشامل وتصدير الـ PDF';

                        <th class="border border-slate-200 p-2">القسم</th>

                        <th class="border border-slate-200 p-2">الإجمالي</th>
                    </tr>
                </thead>

                        <tr class="text-xs border-b border-slate-200">

function exportPDF() {
    const el = document.getElementById('pdf-content');
    const opt = {
        margin:       10,
        filename:     `Procurement_Report_${new Date().toISOString().split('T')[0]}.pdf`,
        image:        { type: 'jpeg', quality: 0.98 },
        html2canvas:  { scale: 2 },
        jsPDF:        { unit: 'mm', format: 'a4', orientation: 'landscape' }
    };
    html2pdf().set(opt).from(el).save();
}

window.onload = async () => {
    setInterval(() => {
        const now = new Date();
        const clockEl = document.getElementById('clock-text');
        if (clockEl) clockEl.innerText = now.toLocaleTimeString('ar-SA');
    }, 1000);

    await syncFromSupabase();
    showPage('dashboard');
};
