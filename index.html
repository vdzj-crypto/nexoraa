<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quotations Hub - منصة عروض الأسعار والمشتريات والعُهد</title>
    
    <!-- Frameworks & CSS Libraries -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.rtl.min.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>

    <!-- Firebase SDK Compat Core -->
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script>

    <style>
        @import url('https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800&display=swap');
        
        :root {
            --primary-dark: #0f172a;
            --sidebar-bg: #1e293b;
            --accent-color: #2563eb;
        }

        body {
            font-family: 'Tajawal', sans-serif;
            background-color: #f8fafc;
            color: #1e293b;
            margin: 0;
            padding: 0;
            overflow-x: hidden;
        }

        .sidebar {
            background-color: var(--sidebar-bg);
            color: #ffffff;
            min-height: 100vh;
            transition: all 0.3s ease;
        }

        .sidebar .nav-link {
            color: #94a3b8;
            border-radius: 12px;
            padding: 12px 16px;
            margin-bottom: 8px;
            font-weight: 500;
            display: flex;
            align-items: center;
            gap: 12px;
            transition: all 0.2s ease-in-out;
        }

        .sidebar .nav-link:hover {
            color: #ffffff;
            background-color: rgba(255, 255, 255, 0.08);
            transform: translateX(-3px);
        }

        .sidebar .nav-link.active {
            color: #ffffff;
            background-color: var(--accent-color);
            box-shadow: 0 4px 14px rgba(37, 99, 235, 0.35);
            font-weight: 700;
        }

        .card-custom {
            background: #ffffff;
            border-radius: 16px;
            border: 1px solid #e2e8f0;
            box-shadow: 0 4px 12px -2px rgba(0, 0, 0, 0.04);
            transition: all 0.2s ease;
        }

        .card-custom:hover {
            box-shadow: 0 8px 20px -4px rgba(0, 0, 0, 0.08);
        }

        .table-custom {
            width: 100%;
            border-collapse: separate;
            border-spacing: 0;
        }

        .table-custom th {
            background-color: #f1f5f9;
            color: #475569;
            font-weight: 700;
            padding: 14px 16px;
            font-size: 0.825rem;
            border-bottom: 2px solid #e2e8f0;
        }

        .table-custom td {
            padding: 14px 16px;
            border-bottom: 1px solid #f1f5f9;
            font-size: 0.85rem;
            vertical-align: middle;
        }

        .table-custom tr:last-child td {
            border-bottom: none;
        }

        .status-badge {
            padding: 4px 10px;
            border-radius: 20px;
            font-size: 0.75rem;
            font-weight: 700;
            display: inline-flex;
            align-items: center;
            gap: 6px;
        }

        .status-pending { background-color: #fef3c7; color: #d97706; }
        .status-approved { background-color: #d1fae5; color: #059669; }
        .status-rejected { background-color: #fee2e2; color: #dc2626; }
        .status-completed { background-color: #e0e7ff; color: #4338ca; }

        .form-input-custom {
            width: 100%;
            padding: 10px 14px;
            border-radius: 10px;
            border: 1px solid #cbd5e1;
            font-size: 0.85rem;
            outline: none;
            transition: border-color 0.2s, box-shadow 0.2s;
        }

        .form-input-custom:focus {
            border-color: #2563eb;
            box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.15);
        }

        .btn-primary-custom {
            background-color: #2563eb;
            color: #ffffff;
            font-weight: 700;
            padding: 10px 20px;
            border-radius: 10px;
            transition: all 0.2s;
        }

        .btn-primary-custom:hover {
            background-color: #1d4ed8;
            box-shadow: 0 4px 12px rgba(37, 99, 235, 0.25);
        }

        @media print {
            .no-print { display: none !important; }
            .sidebar { display: none !important; }
            main { padding: 0 !important; margin: 0 !important; width: 100% !important; }
            body { background: white !important; }
            .card-custom { border: none !important; box-shadow: none !important; }
        }
    </style>
</head>
<body class="bg-slate-50">

    <!-- 1. شاشة تسجيل الدخول -->
    <div id="login-screen" class="min-h-screen flex items-center justify-center bg-slate-900 p-4">
        <div class="max-w-md w-full bg-white rounded-2xl shadow-2xl p-8 border border-slate-100">
            <div class="text-center mb-8">
                <div class="inline-flex p-3 bg-blue-600 text-white rounded-2xl mb-3 shadow-lg shadow-blue-500/30">
                    <i class="fa-solid fa-file-invoice-dollar text-3xl"></i>
                </div>
                <h2 class="text-2xl font-black text-slate-800">Quotations Hub</h2>
                <p class="text-xs text-slate-500 mt-1">منصة إدارة عروض الأسعار والمشتريات والعُهد المالية</p>
            </div>

            <form onsubmit="handleLogin(event)" class="space-y-4">
                <div>
                    <label class="block text-xs font-bold text-slate-700 mb-1">البريد الإلكتروني</label>
                    <input type="email" id="login-email" required placeholder="user@company.com" class="form-input-custom">
                </div>
                <div>
                    <label class="block text-xs font-bold text-slate-700 mb-1">كلمة المرور</label>
                    <input type="password" id="login-password" required placeholder="••••••••" class="form-input-custom">
                </div>
                <div id="login-error" class="text-red-500 text-xs font-bold hidden bg-red-50 p-3 rounded-lg border border-red-200"></div>
                <button type="submit" id="login-btn" class="w-full btn-primary-custom flex justify-center items-center gap-2">
                    <span>تسجيل الدخول</span>
                </button>
            </form>
            <div class="mt-6 text-center">
                <p class="text-xs text-slate-400">جميع الحقوق محفوظة &copy; Quotations Hub 2026</p>
            </div>
        </div>
    </div>

    <!-- 2. الواجهة الرئيسية للتطبيق -->
    <div id="app-screen" class="hidden flex flex-col md:flex-row min-h-screen">
        
        <!-- القائمة الجانبية Navigation Sidebar -->
        <aside class="w-full md:w-72 sidebar p-5 flex flex-col justify-between shadow-xl no-print">
            <div>
                <div class="flex items-center gap-3 mb-8 px-2 pt-2">
                    <div class="bg-blue-600 p-2.5 rounded-xl text-white shadow-md">
                        <i class="fa-solid fa-file-invoice-dollar text-2xl"></i>
                    </div>
                    <div>
                        <h1 class="text-lg font-black text-white">Quotations Hub</h1>
                        <p id="user-role-badge" class="text-xs text-amber-400 font-bold">جاري المزامنة...</p>
                    </div>
                </div>
                
                <nav class="nav flex-column" id="main-nav">
                    <!-- يتم بناء عناصر Navigation بناءً على الصلاحيات عبر JS -->
                </nav>
            </div>

            <div class="pt-4 border-t border-slate-700/60">
                <div class="flex items-center justify-between px-2 mb-3">
                    <div class="flex items-center gap-2 overflow-hidden">
                        <i class="fa-solid fa-circle-user text-slate-400 text-lg"></i>
                        <span id="user-email-display" class="text-xs text-slate-300 font-medium truncate max-w-[140px]"></span>
                    </div>
                    <button onclick="handleLogout()" title="تسجيل الخروج" class="text-xs bg-red-500/20 text-red-400 hover:bg-red-500 hover:text-white px-2.5 py-1.5 rounded-lg transition">
                        <i class="fa-solid fa-right-from-bracket"></i>
                    </button>
                </div>
            </div>
        </aside>

        <!-- المحتوى الرئيسي Main Content Area -->
        <main class="flex-1 p-6 md:p-8 overflow-y-auto">
            <header class="flex justify-between items-center mb-8 bg-white p-5 rounded-2xl border border-slate-200/80 shadow-sm no-print">
                <div>
                    <h2 id="page-title" class="text-2xl font-black text-slate-800">---</h2>
                    <p id="page-subtitle" class="text-xs text-slate-500 mt-1">---</p>
                </div>
                <div class="flex items-center gap-3">
                    <div class="text-xs font-bold text-slate-600 bg-slate-100 px-4 py-2.5 rounded-xl border flex items-center gap-2">
                        <i class="fa-solid fa-user-shield text-blue-600"></i>
                        <span id="current-user-name">...</span>
                    </div>
                    <button onclick="window.print()" class="bg-slate-800 hover:bg-slate-900 text-white text-xs font-bold px-4 py-2.5 rounded-xl transition flex items-center gap-2">
                        <i class="fa-solid fa-print"></i> طباعة
                    </button>
                </div>
            </header>

            <div id="app-content">
                <!-- المحتوى يتغير ديناميكياً هنا -->
            </div>
        </main>
    </div>

    <!-- Modals (نافذة إضافة وتحرير الموردين والأصناف) -->
    <div id="generic-modal" class="fixed inset-0 bg-slate-900/50 backdrop-blur-sm z-50 flex items-center justify-center hidden">
        <div class="bg-white rounded-2xl max-w-lg w-full p-6 shadow-2xl border border-slate-100">
            <div class="flex justify-between items-center mb-4">
                <h3 id="modal-title" class="font-bold text-slate-800 text-base">---</h3>
                <button onclick="closeModal()" class="text-slate-400 hover:text-slate-600 text-lg"><i class="fa-solid fa-xmark"></i></button>
            </div>
            <div id="modal-body">
                <!-- أسطر المودال تضاف بالسوفتوير -->
            </div>
        </div>
    </div>

    <!-- JavaScript Logic -->
    <script>
        // 1. Firebase Initialization
        const firebaseConfig = {
            apiKey: "AIzaSyCVbmyDOHZR7nyQTSEUKWacDyFHdrdMUDY",
            authDomain: "quotations-hub.firebaseapp.com",
            projectId: "quotations-hub",
            storageBucket: "quotations-hub.firebasestorage.app",
            messagingSenderId: "573711718348",
            appId: "1:573711718348:web:a573ba9e151e3124d1ef69",
            measurementId: "G-E5MTZT0N34"
        };

        firebase.initializeApp(firebaseConfig);
        const auth = firebase.auth();
        const db = firebase.firestore();

        // Application State
        let currentUser = null;
        let currentUserProfile = null;
        let globalSuppliers = [];
        let globalAgents = [];

        // App Preloader / Auth Change Engine
        auth.onAuthStateChanged(async (user) => {
            if (user) {
                currentUser = user;
                try {
                    const userDoc = await db.collection('users').doc(user.uid).get();
                    if (userDoc.exists) {
                        currentUserProfile = userDoc.data();
                    } else {
                        currentUserProfile = {
                            name: user.email.split('@')[0],
                            role: 'agent',
                            email: user.email,
                            createdAt: firebase.firestore.FieldValue.serverTimestamp()
                        };
                        await db.collection('users').doc(user.uid).set(currentUserProfile);
                    }
                } catch(e) {
                    console.error("User profile load error:", e);
                    currentUserProfile = { name: user.email.split('@')[0], role: 'agent', email: user.email };
                }
                await loadGlobalMetadata();
                showApp();
            } else {
                showLogin();
            }
        });

        async function loadGlobalMetadata() {
            try {
                const agentsSnap = await db.collection('users').where('role', '==', 'agent').get();
                globalAgents = [];
                agentsSnap.forEach(doc => globalAgents.push({ id: doc.id, ...doc.data() }));

                const suppliersSnap = await db.collection('suppliers').get();
                globalSuppliers = [];
                suppliersSnap.forEach(doc => globalSuppliers.push({ id: doc.id, ...doc.data() }));
            } catch (e) {
                console.log("Metadata loading error:", e);
            }
        }

        function showLogin() {
            document.getElementById('login-screen').classList.remove('hidden');
            document.getElementById('app-screen').classList.add('hidden');
        }

        function showApp() {
            document.getElementById('login-screen').classList.add('hidden');
            document.getElementById('app-screen').classList.remove('hidden');
            document.getElementById('user-email-display').innerText = currentUser.email;
            document.getElementById('current-user-name').innerText = currentUserProfile.name || currentUser.email;
            document.getElementById('user-role-badge').innerText = currentUserProfile.role === 'admin' ? '🛡️ المدير (Admin)' : '📦 مندوب المشتريات';

            buildNavigation();
            showPage(currentUserProfile.role === 'admin' ? 'dashboard' : 'my-procurements');
        }

        async function handleLogin(e) {
            e.preventDefault();
            const email = document.getElementById('login-email').value;
            const pass = document.getElementById('login-password').value;
            const errEl = document.getElementById('login-error');
            const btn = document.getElementById('login-btn');
            
            try {
                errEl.classList.add('hidden');
                btn.innerHTML = `<i class="fa-solid fa-spinner fa-spin me-2"></i> جاري التحقق...`;
                btn.disabled = true;
                await auth.signInWithEmailAndPassword(email, pass);
            } catch (err) {
                errEl.innerText = "فشل تسجيل الدخول: تأكد من بيانات الحساب.";
                errEl.classList.remove('hidden');
            } finally {
                btn.innerHTML = `<span>تسجيل الدخول</span>`;
                btn.disabled = false;
            }
        }

        function handleLogout() {
            auth.signOut();
        }

        // Navigation Builder Engine
        function buildNavigation() {
            const nav = document.getElementById('main-nav');
            const isAdmin = currentUserProfile.role === 'admin';

            if (isAdmin) {
                nav.innerHTML = `
                    <a href="#" onclick="showPage('dashboard')" class="nav-link active" id="link-dashboard"><i class="fa-solid fa-chart-pie"></i> لوحة التحكم الشاملة</a>
                    <a href="#" onclick="showPage('hospitality')" class="nav-link" id="link-hospitality"><i class="fa-solid fa-mug-hot"></i> الضيافة والبوفيه</a>
                    <a href="#" onclick="showPage('cleaning')" class="nav-link" id="link-cleaning"><i class="fa-solid fa-pump-soap"></i> أدوات النظافة</a>
                    <a href="#" onclick="showPage('stationery')" class="nav-link" id="link-stationery"><i class="fa-solid fa-print"></i> القرطاسية والإلكترونيات</a>
                    <a href="#" onclick="showPage('custody')" class="nav-link" id="link-custody"><i class="fa-solid fa-wallet text-amber-400"></i> إدارة العُهد والمشتريات</a>
                    <a href="#" onclick="showPage('suppliers')" class="nav-link" id="link-suppliers"><i class="fa-solid fa-truck-field text-emerald-400"></i> قائمة الموردين المعتمدين</a>
                    <a href="#" onclick="showPage('users-manage')" class="nav-link" id="link-users-manage"><i class="fa-solid fa-users-gear text-blue-400"></i> إدارة الحسابات والصلاحيات</a>
                `;
            } else {
                nav.innerHTML = `
                    <a href="#" onclick="showPage('my-procurements')" class="nav-link active" id="link-my-procurements"><i class="fa-solid fa-boxes-packing text-emerald-400"></i> قائمتي الخاصة بالمشتريات</a>
                    <a href="#" onclick="showPage('my-custody')" class="nav-link" id="link-my-custody"><i class="fa-solid fa-wallet text-amber-400"></i> العُهدة المالية الخاصة بي</a>
                `;
            }
        }

        // Router Engine
        function showPage(pageId) {
            document.querySelectorAll('.nav-link').forEach(l => l.classList.remove('active'));
            const activeLink = document.getElementById(`link-${pageId}`);
            if (activeLink) activeLink.classList.add('active');

            const container = document.getElementById('app-content');

            if (pageId === 'dashboard') renderAdminDashboard(container);
            else if (pageId === 'hospitality') renderCategoryPage(container, 'hospitality', 'الضيافة والبوفيه', 'إدارة عروض أسعار الشاي، القهوة، والمستلزمات');
            else if (pageId === 'cleaning') renderCategoryPage(container, 'cleaning', 'أدوات النظافة', 'إدارة ومتابعة طلبات مواد التنظيف والمطهرات');
            else if (pageId === 'stationery') renderCategoryPage(container, 'stationery', 'القرطاسية والإلكترونيات', 'متابعة أجهزة المكتب والورقيات والمستلزمات');
            else if (pageId === 'custody') renderCustodyPage(container);
            else if (pageId === 'suppliers') renderSuppliersPage(container);
            else if (pageId === 'users-manage') renderUsersManagement(container);
            else if (pageId === 'my-procurements') renderAgentProcurements(container);
            else if (pageId === 'my-custody') renderAgentCustody(container);
        }

        // 1. Dashboard View
        async function renderAdminDashboard(c) {
            document.getElementById('page-title').innerText = 'لوحة تحكم المدير الشاملة';
            document.getElementById('page-subtitle').innerText = 'نظرة عامة على المشتريات، الموردين، وإجمالي العُهد والمصروفات';

            c.innerHTML = `
                <div class="grid grid-cols-1 md:grid-cols-4 gap-4 mb-6">
                    <div class="card-custom p-5 border-r-4 border-r-blue-600">
                        <p class="text-xs text-slate-500 font-bold mb-1">إجمالي الميزانية التقديرية</p>
                        <h3 id="dash-total-est" class="text-2xl font-black text-slate-800">0.00 ر.س</h3>
                    </div>
                    <div class="card-custom p-5 border-r-4 border-r-emerald-500">
                        <p class="text-xs text-slate-500 font-bold mb-1">إجمالي المشتريات المكتملة</p>
                        <h3 id="dash-total-done" class="text-2xl font-black text-slate-800">0.00 ر.س</h3>
                    </div>
                    <div class="card-custom p-5 border-r-4 border-r-amber-500">
                        <p class="text-xs text-slate-500 font-bold mb-1">طلبات قيد الشراء والتنسيق</p>
                        <h3 id="dash-pending-count" class="text-2xl font-black text-slate-800">0</h3>
                    </div>
                    <div class="card-custom p-5 border-r-4 border-r-purple-600">
                        <p class="text-xs text-slate-500 font-bold mb-1">مندوبي المشتريات</p>
                        <h3 class="text-2xl font-black text-slate-800">${globalAgents.length} مندوب</h3>
                    </div>
                </div>

                <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
                    <div class="card-custom p-6">
                        <h3 class="font-bold text-slate-800 text-base mb-4"><i class="fa-solid fa-clock-rotate-left me-2 text-blue-600"></i>آخر التحديثات والمشتريات المضافة</h3>
                        <div id="dash-recent-list" class="space-y-3">
                            <div class="text-center py-6 text-slate-400 text-xs"><i class="fa-solid fa-spinner fa-spin me-1"></i> جاري تحميل السجلات...</div>
                        </div>
                    </div>

                    <div class="card-custom p-6">
                        <h3 class="font-bold text-slate-800 text-base mb-4"><i class="fa-solid fa-chart-simple me-2 text-emerald-600"></i>توزيع المصروفات حسب الأقسام</h3>
                        <div class="space-y-4 text-xs">
                            <div>
                                <div class="flex justify-between font-bold mb-1"><span>قسم الضيافة والبوفيه</span><span id="p-hosp-val">0 ر.س</span></div>
                                <div class="w-full bg-slate-100 rounded-full h-2.5"><div id="p-hosp-bar" class="bg-blue-600 h-2.5 rounded-full" style="width: 0%"></div></div>
                            </div>
                            <div>
                                <div class="flex justify-between font-bold mb-1"><span>قسم أدوات النظافة</span><span id="p-clean-val">0 ر.س</span></div>
                                <div class="w-full bg-slate-100 rounded-full h-2.5"><div id="p-clean-bar" class="bg-emerald-500 h-2.5 rounded-full" style="width: 0%"></div></div>
                            </div>
                            <div>
                                <div class="flex justify-between font-bold mb-1"><span>قسم القرطاسية والإلكترونيات</span><span id="p-stat-val">0 ر.س</span></div>
                                <div class="w-full bg-slate-100 rounded-full h-2.5"><div id="p-stat-bar" class="bg-amber-500 h-2.5 rounded-full" style="width: 0%"></div></div>
                            </div>
                        </div>
                    </div>
                </div>
            `;

            // Dynamic Dashboard Calculations
            try {
                const snap = await db.collection('quotations').get();
                let totalEst = 0;
                let totalDone = 0;
                let pendingCount = 0;
                let hospTot = 0, cleanTot = 0, statTot = 0;
                let recentItems = [];

                snap.forEach(doc => {
                    const data = doc.data();
                    const tot = parseFloat(data.total) || 0;
                    totalEst += tot;

                    if (data.status === 'تم الشراء والتسليم') {
                        totalDone += tot;
                    } else {
                        pendingCount++;
                    }

                    if (data.category === 'hospitality') hospTot += tot;
                    if (data.category === 'cleaning') cleanTot += tot;
                    if (data.category === 'stationery') statTot += tot;

                    recentItems.push({ id: doc.id, ...data });
                });

                document.getElementById('dash-total-est').innerText = totalEst.toLocaleString() + ' ر.س';
                document.getElementById('dash-total-done').innerText = totalDone.toLocaleString() + ' ر.س';
                document.getElementById('dash-pending-count').innerText = pendingCount;

                document.getElementById('p-hosp-val').innerText = hospTot.toLocaleString() + ' ر.س';
                document.getElementById('p-clean-val').innerText = cleanTot.toLocaleString() + ' ر.س';
                document.getElementById('p-stat-val').innerText = statTot.toLocaleString() + ' ر.س';

                const grandTotal = totalEst || 1;
                document.getElementById('p-hosp-bar').style.width = Math.min((hospTot / grandTotal) * 100, 100) + '%';
                document.getElementById('p-clean-bar').style.width = Math.min((cleanTot / grandTotal) * 100, 100) + '%';
                document.getElementById('p-stat-bar').style.width = Math.min((statTot / grandTotal) * 100, 100) + '%';

                const listEl = document.getElementById('dash-recent-list');
                if (recentItems.length === 0) {
                    listEl.innerHTML = `<p class="text-center text-slate-400 text-xs py-4">لا توجد عروض أسعار مسجلة</p>`;
                } else {
                    listEl.innerHTML = recentItems.slice(0, 5).map(item => `
                        <div class="flex items-center justify-between p-3 bg-slate-50 rounded-xl border border-slate-100">
                            <div>
                                <h4 class="font-bold text-slate-800 text-xs">${item.item_name}</h4>

        async function loadCustodyData() {
            try {
                const snap = await db.collection('custodies').get();
                let given = 0, spent = 0;
                const tbody = document.getElementById('custody-table-body');

                if (snap.empty) {
                    tbody.innerHTML = `<tr><td colspan="6" class="text-center py-6 text-slate-400">لا توجد عُهد مالية مسجلة.</td></tr>`;
                    return;
                }

                let html = '';
                snap.forEach(doc => {
                    const c = doc.data();
                    const amt = c.amount || 0;
                    const sp = c.spent || 0;
                    const rem = amt - sp;

                    given += amt;
                    spent += sp;

                    html += `
                        <tr>
                            <td class="font-bold text-slate-800">${c.agent_email}</td>
                            <td class="font-bold text-amber-600">${amt.toLocaleString()} ر.س</td>

                            <td class="font-bold text-blue-600">${rem.toLocaleString()} ر.س</td>
                            <td class="text-xs text-slate-500">${c.notes || '-'}</td>
                            <td class="text-xs text-slate-400">${c.issuedAt ? new Date(c.issuedAt.toDate()).toLocaleDateString('ar-SA') : 'الآن'}</td>
                        </tr>
                    `;
                });

                document.getElementById('total-custody-given').innerText = given.toLocaleString() + ' ر.س';
                document.getElementById('total-custody-spent').innerText = spent.toLocaleString() + ' ر.س';
                document.getElementById('total-custody-rem').innerText = (given - spent).toLocaleString() + ' ر.س';
                tbody.innerHTML = html;
            } catch(e) {
                console.error("Error loading custody data:", e);
            }
        }

            const role = document.getElementById('new-user-role').value;

            try {
                const userRef = db.collection('users').doc();
                await userRef.set({
                    name: name,
                    email: email,
                    role: role,
                    createdAt: firebase.firestore.FieldValue.serverTimestamp()
                });
                alert('تم تسجيل الموظف وصلاحياته بنجاح!');
                await loadGlobalMetadata();
                showPage('users-manage');
            } catch(err) {
                alert('حدث خطأ: ' + err.message);
            }
        }

        async function loadUsersData() {
            try {
                const snap = await db.collection('users').get();
                const tbody = document.getElementById('users-table-body');

                if (snap.empty) {
                    tbody.innerHTML = `<tr><td colspan="4" class="text-center py-6 text-slate-400">لا يوجد مستخدمون مسجلون.</td></tr>`;
                    return;
                }

                let html = '';
                snap.forEach(doc => {
                    const u = doc.data();
                    html += `
                        <tr>
                            <td class="font-bold text-slate-800">${u.name || 'بدون اسم'}</td>
                            <td>${u.email}</td>
                            <td>
                                <span class="px-2.5 py-1 rounded-full text-xs font-bold ${u.role === 'admin' ? 'bg-purple-100 text-purple-800' : 'bg-blue-100 text-blue-800'}">
                                    ${u.role === 'admin' ? '🛡️ مدير النظام' : '📦 مندوب مشتريات'}
                                </span>
                            </td>
                            <td class="text-xs text-slate-400">${u.createdAt ? new Date(u.createdAt.toDate()).toLocaleDateString('ar-SA') : 'الآن'}</td>
                        </tr>
                    `;
                });
                tbody.innerHTML = html;
            } catch(e) {
                console.error("Error loading users:", e);
            }
        }

        // 6. Procurement Agent View (My Tasks)
        async function renderAgentProcurements(c) {
            document.getElementById('page-title').innerText = 'قائمة المشتريات والمهام المطلوبة منك';
            document.getElementById('page-subtitle').innerText = 'استعراض الطلبات المسندة لبريدك وشراء المنتجات وتحديث الحالات';

            c.innerHTML = `
                <div class="card-custom p-6">
                    <div class="flex justify-between items-center mb-4">
                        <h3 class="font-bold text-slate-800 text-base"><i class="fa-solid fa-boxes-packing me-2 text-emerald-600"></i>المهام المسندة لإيميلك (${currentUser.email})</h3>
                    </div>
                    <div class="overflow-x-auto">
                        <table class="table-custom text-right">
                            <thead>
                                <tr>
                                    <th>الصنف المطلوب</th>
                                    <th>القسم</th>
                                    <th>الكمية</th>
                                    <th>المبلغ التقديري</th>
                                    <th>المورد المقترح</th>
                                    <th>الحالة</th>
                                    <th class="no-print">الإجراء</th>
                                </tr>
                            </thead>
                            <tbody id="agent-tasks-tbody">
                                <tr><td colspan="7" class="text-center py-6 text-slate-400"><i class="fa-solid fa-spinner fa-spin me-1"></i> جاري جلب مشترياتك...</td></tr>
                            </tbody>
                        </table>
                    </div>
                </div>
            `;

            try {
                const snap = await db.collection('quotations').where('assigned_to', '==', currentUser.email).get();
                const tbody = document.getElementById('agent-tasks-tbody');

                if (snap.empty) {
                    tbody.innerHTML = `<tr><td colspan="7" class="text-center py-6 text-slate-400">لا توجد مشتريات أو عروض أسعار مسندة لبريدك حالياً.</td></tr>`;
                    return;
                }

                let html = '';
                snap.forEach(doc => {
                    const q = doc.data();
                    const isDone = q.status === 'تم الشراء والتسليم';
                    html += `
                        <tr>
                            <td class="font-bold text-slate-800">${q.item_name}</td>
                            <td><span class="text-xs bg-slate-100 text-slate-700 px-2 py-0.5 rounded">${q.category}</span></td>
                            <td>${q.quantity}</td>
                            <td class="font-black text-emerald-600">${q.total} ر.س</td>
                            <td>${q.supplier || '-'}</td>
                            <td>
                                <span class="status-badge ${isDone ? 'status-approved' : 'status-pending'}">
                                    ${q.status || 'قيد الانتظار'}
                                </span>
                            </td>
                            <td class="no-print">
                                ${!isDone ? `
                                    <button onclick="markTaskAsCompleted('${doc.id}')" class="bg-emerald-600 hover:bg-emerald-700 text-white text-xs font-bold px-3 py-1.5 rounded-lg transition flex items-center gap-1">
                                        <i class="fa-solid fa-check"></i> تأكيد الشراء
                                    </button>
                                ` : `<span class="text-xs text-emerald-600 font-bold"><i class="fa-solid fa-circle-check me-1"></i>مكتمل</span>`}
                            </td>
                        </tr>
                    `;
                });
                tbody.innerHTML = html;
            } catch(e) {
                console.error("Agent procurements load error:", e);
            }
        }

        async function markTaskAsCompleted(docId) {
            if (confirm('هل تؤكد إتمامك لشراء هذا البند وتسليمه؟')) {
                await db.collection('quotations').doc(docId).update({
                    status: 'تم الشراء والتسليم',
                    completedAt: firebase.firestore.FieldValue.serverTimestamp()
                });
                renderAgentProcurements(document.getElementById('app-content'));
            }
        }

        // 7. Agent Personal Custody View
        async function renderAgentCustody(c) {
            document.getElementById('page-title').innerText = 'العُهدة المالية الخاصة بي';
            document.getElementById('page-subtitle').innerText = 'متابعة الرصيد المستلم والمبالغ المصروفة والمتبقية لديك';

            c.innerHTML = `<div class="text-center py-8 text-slate-400"><i class="fa-solid fa-spinner fa-spin text-2xl"></i> جاري استعلام العُهدة...</div>`;

            try {
                const snap = await db.collection('custodies').where('agent_email', '==', currentUser.email).get();

                let totalAmt = 0, totalSp = 0;
                let rows = '';

                snap.forEach(doc => {
                    const data = doc.data();
                    const amt = data.amount || 0;
                    const sp = data.spent || 0;
                    totalAmt += amt;
                    totalSp += sp;

                    rows += `
                        <tr>
                            <td class="font-bold text-amber-600">${amt.toLocaleString()} ر.س</td>
                            <td class="font-bold text-emerald-600">${sp.toLocaleString()} ر.س</td>
                            <td class="font-bold text-blue-600">${(amt - sp).toLocaleString()} ر.س</td>
                            <td class="text-xs text-slate-500">${data.notes || '-'}</td>
                        </tr>
                    `;
                });

                const rem = totalAmt - totalSp;

                c.innerHTML = `
                    <div class="grid grid-cols-1 md:grid-cols-3 gap-6 mb-6">
                        <div class="card-custom p-6 border-t-4 border-t-amber-500">
                            <h4 class="font-bold text-slate-700 text-sm mb-2">إجمالي العُهد المودعة بك</h4>
                            <p class="text-2xl font-black text-amber-600">${totalAmt.toLocaleString()} ر.س</p>
                        </div>
                        <div class="card-custom p-6 border-t-4 border-t-emerald-500">
                            <h4 class="font-bold text-slate-700 text-sm mb-2">المبالغ المصروفة</h4>
                            <p class="text-2xl font-black text-emerald-600">${totalSp.toLocaleString()} ر.س</p>
                        </div>
                        <div class="card-custom p-6 border-t-4 border-t-blue-500">
                            <h4 class="font-bold text-slate-700 text-sm mb-2">الرصيد المتبقي بعهدتك</h4>
                            <p class="text-2xl font-black text-blue-600">${rem.toLocaleString()} ر.س</p>
                        </div>
                    </div>

                    <div class="card-custom p-6">
                        <h3 class="font-bold text-slate-800 text-base mb-4">تفاصيل العُهد المسلمة لك</h3>
                        <table class="table-custom text-right">
                            <thead>
                                <tr>
                                    <th>المبلغ المودع</th>
                                    <th>المصروف</th>
                                    <th>المتبقي</th>
                                    <th>البيان</th>
                                </tr>
                            </thead>
                            <tbody>${rows || '<tr><td colspan="4" class="text-center py-6 text-slate-400">لا توجد عُهد مالية مسجلة باسمك حالياً.</td></tr>'}</tbody>
                        </table>
                    </div>
                `;
            } catch(e) {
                console.error("Agent custody error:", e);
            }
        }

        // Modal Controls
        function closeModal() {
            document.getElementById('generic-modal').classList.add('hidden');
        }
    </script>
</body>
</html>
